apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpulse
  namespace: devpulse
  labels:
    app: devpulse
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devpulse
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devpulse
        version: v1
    spec:
      containers:
        - name: devpulse
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/devpulse:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
