<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse — Service Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f0f6fc;
    }

    .header h1 span {
      color: #58a6ff;
    }

    .pod-badge {
      background: #1c2128;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: #8b949e;
    }

    .pod-badge strong {
      color: #58a6ff;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* ─── Status Banner ─── */
    .status-banner {
      padding: 16px 24px;
      border-radius: 10px;
      margin-bottom: 28px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-banner.operational {
      background: #0d1f0d;
      border: 1px solid #238636;
      color: #3fb950;
    }

    .status-banner.partial {
      background: #2a1e00;
      border: 1px solid #9e6a03;
      color: #e3b341;
    }

    .status-banner.major {
      background: #2d0a0a;
      border: 1px solid #da3633;
      color: #f85149;
    }

    /* ─── Stats Row ─── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 36px;
      font-weight: 700;
    }

    .stat-card .label {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
    }

    .stat-card.healthy .number { color: #3fb950; }
    .stat-card.degraded .number { color: #e3b341; }
    .stat-card.down .number { color: #f85149; }

    /* ─── Service Table ─── */
    .table-wrap {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
    }

    .table-title {
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px 20px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      background: #0d1117;
      border-bottom: 1px solid #30363d;
    }

    td {
      padding: 14px 20px;
      font-size: 14px;
      border-bottom: 1px solid #21262d;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: #1c2128;
    }

    .svc-name {
      font-weight: 600;
      color: #f0f6fc;
    }

    /* ─── Status Dots ─── */
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-dot::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.healthy { color: #3fb950; }
    .status-dot.healthy::before { background: #3fb950; }

    .status-dot.degraded { color: #e3b341; }
    .status-dot.degraded::before { background: #e3b341; }

    .status-dot.down { color: #f85149; }
    .status-dot.down::before { background: #f85149; }

    .uptime { color: #8b949e; }
    .response-time { color: #8b949e; }

    .footer {
      text-align: center;
      padding: 24px;
      color: #484f58;
      font-size: 12px;
    }

    /* ─── Refresh indicator ─── */
    .refresh-dot {
      width: 6px;
      height: 6px;
      background: #3fb950;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr; }
      .header { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ <span>Dev</span>Pulse</h1>
    <div class="pod-badge">
      <span class="refresh-dot"></span>&nbsp;
      Pod: <strong id="podName">loading...</strong>
    </div>
  </div>

  <div class="container">
    <div class="status-banner operational" id="statusBanner">
      Loading...
    </div>

    <div class="stats-row">
      <div class="stat-card healthy">
        <div class="number" id="healthyCount">-</div>
        <div class="label">Healthy</div>
      </div>
      <div class="stat-card degraded">
        <div class="number" id="degradedCount">-</div>
        <div class="label">Degraded</div>
      </div>
      <div class="stat-card down">
        <div class="number" id="downCount">-</div>
        <div class="label">Down</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-title">Services</div>
      <table>
        <thead>
          <tr>
            <th>Service</th>
            <th>Status</th>
            <th>Uptime</th>
            <th>Response</th>
          </tr>
        </thead>
        <tbody id="serviceList">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    DevPulse v1.0.0 &mdash; Auto-refreshes every 10s
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/services');
        const data = await res.json();

        // Pod name
        document.getElementById('podName').textContent = data.servedBy;

        // Stats
        document.getElementById('healthyCount').textContent = data.stats.healthy;
        document.getElementById('degradedCount').textContent = data.stats.degraded;
        document.getElementById('downCount').textContent = data.stats.down;

        // Banner
        const banner = document.getElementById('statusBanner');
        banner.className = 'status-banner';
        if (data.overall === 'all systems operational') {
          banner.classList.add('operational');
          banner.textContent = '✓ All Systems Operational';
        } else if (data.overall === 'partial outage') {
          banner.classList.add('partial');
          banner.textContent = '⚠ Partial Outage Detected';
        } else {
          banner.classList.add('major');
          banner.textContent = '✕ Major Outage';
        }

        // Table
        const tbody = document.getElementById('serviceList');
        tbody.innerHTML = data.services.map(svc => `
          <tr>
            <td class="svc-name">${svc.name}</td>
            <td><span class="status-dot ${svc.status}">${svc.status}</span></td>
            <td class="uptime">${svc.uptime}%</td>
            <td class="response-time">${svc.responseTime > 0 ? svc.responseTime + 'ms' : '—'}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Failed to load:', err);
      }
    }

    loadData();
    setInterval(loadData, 10000);
  </script>

</body>
</html>
