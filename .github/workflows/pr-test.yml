# ============================================
# CI: Runs on every Pull Request to main
# Tests the code BEFORE merging
# ============================================
name: PR — Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Start server & run tests
        working-directory: ./app
        run: |
          node server.js &
          sleep 3
          node test.js
          kill %1

      - name: Docker build check
        working-directory: ./app
        run: |
          docker build -t devpulse:pr-${{ github.event.pull_request.number }} .
          echo "✅ Docker build successful"