# ============================================
# CD: Build → Push → Deploy to EKS
# Triggers when PR is merged to main
# ============================================
name: Deploy DevPulse to EKS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'k8s/**'
      - '.github/workflows/**'
  workflow_dispatch: # Manual trigger for demo

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devpulse
  EKS_CLUSTER_NAME: eks-demo
  KUBE_NAMESPACE: devpulse

jobs:
  # ─────────────────────────────────────────
  # Job 1: Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Start server & run tests
        working-directory: ./app
        run: |
          node server.js &
          sleep 3
          node test.js
          kill %1

  # ─────────────────────────────────────────
  # Job 2: Build & Push to ECR
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=${TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        working-directory: ./app
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "✅ Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ─────────────────────────────────────────
  # Job 3: Deploy to EKS
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          # Create namespace if not exists
          kubectl apply -f k8s/namespace.yaml

          # Update image in deployment manifest
          sed -i "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/devpulse:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml

          # Apply all manifests
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
      

          # Wait for rollout
          kubectl rollout status deployment/devpulse \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=120s

          echo "✅ Deployment complete!"

      - name: Verify deployment
        run: |
          echo "── Pod Status ──"
          kubectl get pods -n ${{ env.KUBE_NAMESPACE }} -o wide

          echo ""
          echo "── Service ──"
          kubectl get svc -n ${{ env.KUBE_NAMESPACE }}

          echo ""
          echo "── HPA ──"
          kubectl get hpa -n ${{ env.KUBE_NAMESPACE }}